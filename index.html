<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Supermarket Store</title>
    <link rel="icon" href="data:,">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS for Delivery Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Dark Mode Overrides */
        body.dark-mode {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }
        body.dark-mode .bg-light, 
        body.dark-mode .bg-white {
            background-color: #1e1e1e !important;
            color: #e0e0e0 !important;
        }
        body.dark-mode .text-dark {
            color: #f8f9fa !important;
        }
        body.dark-mode .navbar, 
        body.dark-mode header {
            border-bottom: 1px solid #333 !important;
        }
        body.dark-mode .border-top, 
        body.dark-mode .border-bottom {
            border-color: #333 !important;
        }
        body.dark-mode .modal-content {
            background-color: #242424 !important;
            color: #ffffff !important;
        }
        body.dark-mode .form-control,
        body.dark-mode .form-select,
        body.dark-mode .input-group-text {
            background-color: #333 !important;
            color: #fff !important;
            border-color: #444 !important;
        }
        body.dark-mode .form-control::placeholder {
            color: #aaa !important;
        }
        body.dark-mode .btn-outline-dark {
            color: #fff;
            border-color: #fff;
        }
        body.dark-mode .btn-outline-dark:hover {
            background-color: #fff;
            color: #000;
        }
        body.dark-mode .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        body.dark-mode .text-muted {
            color: #a0a0a0 !important;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header -->
    <header class="sticky-top bg-white border-bottom shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-light bg-white container-fluid px-3 py-2">
            <div class="container-fluid p-0 d-flex flex-column gap-2">
                
                <!-- Top Row: Brand, Delivery, and All Actions -->
                <div class="d-flex align-items-center justify-content-between w-100">
                    
                    <!-- Brand & Delivery (Left) -->
                    <div class="d-flex align-items-center gap-3">
                        <a class="navbar-brand fw-bold text-uppercase tracking-wider text-dark m-0" href="#" data-i18n="brand">
                            Supermarket
                        </a>
                        
                        <div class="d-none d-md-flex align-items-center text-dark" style="font-size: 0.85rem; cursor: pointer;" onclick="window.openCheckout()">
                            <svg width="18" height="18" fill="currentColor" class="me-1 text-primary" viewBox="0 0 16 16">
                                <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
                            </svg>
                            <div>
                                <div class="text-muted lh-1" style="font-size: 0.7rem;" data-i18n="deliverTo">Deliver to</div>
                                <div class="fw-bold lh-1" data-i18n="selectSpot">Select Delivery Spot</div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Controls (Right) -->
                    <div class="d-flex align-items-center gap-2">
                        <!-- EN/AR Translation Toggle -->
                        <button class="btn btn-outline-secondary btn-sm fw-bold rounded-pill" id="langToggle">عربي</button>
                        
                        <!-- Dark Mode Toggle -->
                        <button class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center p-2" id="darkModeToggle" style="width: 32px; height: 32px;">
                            <svg id="moonIcon" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
                            </svg>
                        </button>

                        <!-- Sort & Filter Icons -->
                        <div class="d-flex gap-1">
                            <button class="btn btn-outline-dark btn-sm rounded-pill d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#sortModal">
                                <span class="d-none d-md-inline" data-i18n="sort">Sort</span>
                                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M3.5 2.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 2a.5.5 0 0 0 .708 0l2-2a.5.5 0 0 0-.708-.708L3.5 11.293zm4 0a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h5a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h3a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h1a.5.5 0 0 1 0 1z"/></svg>
                            </button>
                            <button class="btn btn-outline-dark btn-sm rounded-pill d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#filterModal">
                                <span class="d-none d-md-inline" data-i18n="filter">Filter</span>
                                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z"/></svg>
                            </button>
                        </div>

                        <!-- Wishlist -->
                        <button class="btn btn-link text-dark position-relative p-1" onclick="window.openWishlistModal()">
                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15"/></svg>
                            <span id="wishlist-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
                        </button>

                        <!-- Cart Bag -->
                        <button class="btn btn-dark rounded-pill px-3 fw-bold d-flex align-items-center gap-2" onclick="window.openCheckout()">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 1a2.5 2.5 0 0 0-2.5 2.5V4h5v-.5A2.5 2.5 0 0 0 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>
                            <span id="cart-count" class="badge bg-primary text-white rounded-circle">0</span>
                        </button>
                    </div>

                </div>

                <!-- Bottom Row: Dedicated Full-Width Search Bar (Flexbox Fix for RTL/LTR) -->
<div class="w-100">
    <div class="d-flex align-items-stretch w-100 shadow-sm rounded-pill bg-light border" style="overflow: hidden;">
        <input type="text" id="searchInput" class="form-control bg-transparent border-0 shadow-none px-4 translatable-placeholder" placeholder="Search products, brands, essentials..." aria-label="Search" style="outline: none !important; box-shadow: none !important;">
        <button class="btn btn-dark px-4 rounded-0 d-flex align-items-center justify-content-center border-0" type="button" onclick="window.filterAndSortProducts()" style="background-color: #212529;">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
        </button>
    </div>
</div>
            </div>
        </nav>

        <!-- Category Horizontal Scroll Bar -->
        <div class="bg-light py-2 px-3 border-top overflow-x-auto">
            <div id="modal-category-filters" class="d-flex align-items-center gap-2 text-nowrap">
                <!-- Categories loaded dynamically by JS -->
            </div>
        </div>
    </header>

    <main class="container-fluid py-3 px-md-4">
        <!-- Hero Banner Carousel -->
        <div id="heroCarousel" class="carousel slide rounded-4 overflow-hidden mb-4 shadow-sm" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active bg-dark text-white p-4 p-md-5 text-center text-md-start" style="min-height: 200px; background: linear-gradient(135deg, #0f172a, #334155);">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <span class="badge bg-light text-dark mb-2" data-i18n="heroBadge">Daily Supermarket Deals</span>
                            <h2 class="fw-bold fs-3 fs-md-2" data-i18n="heroTitle">Your Everyday Pantry & Grocery Store</h2>
                            <p class="text-light opacity-75 mb-3 small-md" data-i18n="heroSub">Shop everyday essentials, packaged goods, and daily items delivered fast.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="active-filter-tags" class="d-flex flex-wrap gap-2 mb-3"></div>

        <!-- Product Grid Display -->
        <section class="mb-5">
            <div id="product-list" class="row g-2 g-md-3">
                <!-- Items injected dynamically by script.js -->
            </div>
            <div id="scroll-sentinel" class="py-4 text-center"></div>
        </section>

        <!-- Recently Viewed Section -->
        <section id="recently-viewed-section" class="mb-5" style="display:none;">
            <div class="d-flex align-items-center mb-3">
                <svg width="18" height="18" fill="currentColor" class="me-2 text-muted" viewBox="0 0 16 16"><path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/></svg>
                <h5 class="fw-bold mb-0" data-i18n="recent">Recently Viewed Items</h5>
            </div>
            <div id="recently-viewed-list" class="d-flex gap-3 overflow-x-auto pb-2"></div>
        </section>
    </main>

    <!-- Sort Modal -->
    <div class="modal fade" id="sortModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" data-i18n="sortBy">Sort By</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body d-grid gap-2">
                    <button class="btn btn-outline-dark rounded-pill text-start" onclick="window.selectSortOption('default', 'Default', this)" data-i18n="sortDef">Default</button>
                    <button class="btn btn-outline-dark rounded-pill text-start" onclick="window.selectSortOption('price-asc', 'Price: Low to High', this)" data-i18n="sortLow">Price: Low to High</button>
                    <button class="btn btn-outline-dark rounded-pill text-start" onclick="window.selectSortOption('price-desc', 'Price: High to Low', this)" data-i18n="sortHigh">Price: High to Low</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Filter Modal -->
    <div class="modal fade" id="filterModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" data-i18n="filterItems">Filter Items</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold small" data-i18n="maxPrice">Max Price (EGP)</label>
                        <input type="range" class="form-range" id="maxPriceSlider" min="0" max="50000" step="500" value="50000">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary rounded-pill" onclick="window.resetFilters()" data-i18n="reset">Reset</button>
                    <button type="button" class="btn btn-dark rounded-pill" data-bs-dismiss="modal" data-i18n="apply">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="script.js"></script>

    <!-- Custom Script: Dark Mode & EN/AR Translation Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. DARK MODE LOGIC ---
            const toggleBtn = document.getElementById('darkModeToggle');
            const body = document.body;
            const currentTheme = localStorage.getItem('theme') || 'light';

            if (currentTheme === 'dark') body.classList.add('dark-mode');

            toggleBtn.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
            });

            // --- 2. TRANSLATION LOGIC (INCLUDING CUSTOM PRODUCTS) ---
            const langBtn = document.getElementById('langToggle');
            let currentLang = localStorage.getItem('lang') || 'en';
            
            // Standard UI Dictionary
            const uiDict = {
                en: {
                    brand: "Supermarket", deliverTo: "Deliver to", selectSpot: "Select Delivery Spot",
                    sort: "Sort", filter: "Filter", heroBadge: "Daily Supermarket Deals",
                    heroTitle: "Your Everyday Pantry & Grocery Store", 
                    heroSub: "Shop everyday essentials, packaged goods, and daily items delivered fast.",
                    recent: "Recently Viewed Items", sortBy: "Sort By", sortDef: "Default", 
                    sortLow: "Price: Low to High", sortHigh: "Price: High to Low", filterItems: "Filter Items",
                    maxPrice: "Max Price (EGP)", reset: "Reset", apply: "Apply", searchPlace: "Search products..."
                },
                ar: {
                    brand: "سوبر ماركت", deliverTo: "التوصيل إلى", selectSpot: "اختر موقع التوصيل",
                    sort: "ترتيب", filter: "تصفية", heroBadge: "عروض السوبر ماركت اليومية",
                    heroTitle: "بقالتك ومتجرك اليومي", 
                    heroSub: "تسوق الأساسيات اليومية، والسلع المعبأة، والعناصر اليومية تصلك بسرعة.",
                    recent: "العناصر المعروضة مؤخراً", sortBy: "ترتيب حسب", sortDef: "الافتراضي", 
                    sortLow: "السعر: من الأقل للأعلى", sortHigh: "السعر: من الأعلى للأقل", filterItems: "تصفية العناصر",
                    maxPrice: "الحد الأقصى للسعر (جنيه)", reset: "إعادة ضبط", apply: "تطبيق", searchPlace: "ابحث عن المنتجات..."
                }
            };

            // Custom Product Name Dictionary
            const productDict = {
                "لبن بخيره": "Laban Bekheiro",
                "Laban Bekheiro": "لبن بخيره"
            };

            function applyTranslation() {
                // Set RTL/LTR and update Bootstrap input group layout orientation natively
                document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
                langBtn.innerText = currentLang === 'ar' ? 'English' : 'عربي';

                // Translate Static UI Elements
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (uiDict[currentLang][key]) el.innerText = uiDict[currentLang][key];
                });

                // Translate Placeholders
                const searchInput = document.querySelector('.translatable-placeholder');
                if (searchInput) searchInput.placeholder = uiDict[currentLang].searchPlace;

                // Translate Dynamic Products Currently on Screen
                translateDynamicNodes();
            }

            // Function to swap specific product names dynamically
            function translateDynamicNodes() {
                const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                let node;
                while (node = walker.nextNode()) {
                    let text = node.nodeValue.trim();
                    if (text && productDict[text]) {
                        if (currentLang === 'ar' && text === "Laban Bekheiro") {
                            node.nodeValue = node.nodeValue.replace("Laban Bekheiro", "لبن بخيره");
                        } else if (currentLang === 'en' && text === "لبن بخيره") {
                            node.nodeValue = node.nodeValue.replace("لبن بخيره", "Laban Bekheiro");
                        }
                    }
                }
            }

            // Toggle Language on Click
            langBtn.addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'ar' : 'en';
                localStorage.setItem('lang', currentLang);
                applyTranslation();
            });

            // Run on initial load
            applyTranslation();

            // --- 3. MUTATION OBSERVER ---
            const observer = new MutationObserver((mutations) => {
                let shouldTranslate = false;
                mutations.forEach(mutation => {
                    if (mutation.addedNodes.length > 0) shouldTranslate = true;
                });
                if (shouldTranslate) translateDynamicNodes();
            });
            
            observer.observe(document.getElementById('product-list'), { childList: true, subtree: true });
        });
    </script>
</body>
</html>
